        <p>ATM の IV をローソク足・折れ線で。1 分足〜日足、2018 年 10 月から。</p>

            <li>限月 0・1</li>

        <ul class="home-tags">
            <li>OTM 合成</li>
            <li>bid〜ask の幅</li>
            <li>約定の点</li>

<footer class="home-footer">
    取引時間中に毎分取得したデータです。時刻はすべて日本時間。
