# 日経225オプションの取引カレンダー（apps/ingest が読む。docs/runbook.md の「取引カレンダー（#63）」）
#
# 休業日（closed_dates・covered_until）は JPX から自動で取り込んだ BigQuery の版（optionchan_tokyo.trading_calendar_latest）を
# ingest が使う。ここの値は BigQuery を読めないときの予備と、別リポジトリのシミュレーターの同期用（廃止の条件は runbook）。
# 最新版から生成: python -m optionchan_ingest.calendar_sync --print-toml
#
# 出典: 大阪取引所「祝日取引」の祝日取引実施日の表
#   https://www.jpx.co.jp/derivatives/rules/holidaytrading/index.html （2026-10-12 に確認）
# 立会時間: デイ 8:45〜15:45、ナイト 17:00〜翌 6:00（同ページの「取引時間/取引日」）
#
# 判定の規則（apps/ingest/src/optionchan_ingest/calendar.py）:
# - 取引日 = 土日・closed_dates 以外の日。平日の祝日は祝日取引を実施するので取引日（実施しない日だけ closed_dates に書く）
# - 年末年始の休業日は 12/31・1/1・1/2・1/3（業務規程）。平日に当たるものを closed_dates に書く
# - 取引日 P の 17:00〜翌 6:00 が夜間セッション（次の取引日の取引日扱い）。大納会の夜も実施する（2025-12-30 の実データで確認）
# - no_night_session_before に書いた取引日は、直前の夜間セッションが無いものとして扱う（臨時の休止用。通常は空）
# - covered_until は「休業日を漏れなく書いた最終日」。過ぎても取り込みは止めない:
#   closed_dates は covered_until より後の日付（「予定」の日）も使い、書いていない平日は取引日として扱う。
#   期限切れの間は鮮度判定をせず、1 日 1 回 ERROR calendar_outdated を出す（14 日前から WARNING calendar_expiring）

# 確定分の最終日。2027 年下半期は「予定」なので確定の公表（2026-12 予定）を見て延ばす
covered_until = 2027-06-30

# ページ時刻の約 15 分遅れ + 余裕。セッション終了後もこの分数だけ取り込みを続ける
grace_minutes = 30

# 平日の休業日（年末年始・祝日取引を実施しない日）。土日は書かなくてよい
closed_dates = [
  2026-11-23, # 勤労感謝の日（BCP テストのため祝日取引を実施しない。確定）
  2026-12-31, # 年末休業日（確定）
  2027-01-01, # 元日（1/2・1/3 は土日）
  2027-09-20, # 敬老の日（BCP テストのため実施しない。予定）
  2027-12-31, # 年末休業日（予定）
]

no_night_session_before = []

# 立会時間（JST の実時刻）。この表より後に書いたキーは [sessions] に入るので、上の値は必ずこの表より前に書く
[sessions]
day_open = "08:45"
day_close = "15:45"
night_open = "17:00"
night_close = "06:00"
