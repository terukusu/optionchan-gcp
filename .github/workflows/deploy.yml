# master の Terraform を本番へ反映する（#10）。
# plan に差分があるときだけ apply job が動き、Environment prod の承認を待つ（差分 0 なら承認待ちを作らない）。
# plan ファイルは artifact で渡さない（公開リポジトリの artifact は誰でも取得でき、state 由来の値を含む）。
# apply は承認後にもう一度 plan して適用する。
# 取り込み（ingest、#33）・ビューアー（viewer、#53）のイメージ: タグは入力の git のハッシュ（.github/scripts/image.sh）。
# Artifact Registry に無ければ apply job が GCP の認証より前にビルド・検査し、認証後に push してから digest で apply する。
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  # プロジェクト固有の値は repository variables で渡す（docs/setup.md の「2. GitHub の設定」）
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  # 失敗時のログ末尾に使うマスク: 9 桁以上の数字（プロジェクト番号・チャネル ID 等）と、SA 以外のメールアドレス
  MASK_SED: >-
    s/[0-9]{9,}/<num>/g;
    s/@([A-Za-z0-9-]+)\.iam\.gserviceaccount\.com/__SA__\1__/g;
    s/[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}/<email>/g;
    s/__SA__([A-Za-z0-9-]+)__/@\1.iam.gserviceaccount.com/g
  # terraform show -json の出力から「アドレス: 操作」と操作ごとの件数だけを Markdown にする
  PLAN_SUMMARY_JQ: |
    def ops:
      (if .change.importing then ["import"] else [] end)
      + (.change.actions
         | if . == ["delete", "create"] or . == ["create", "delete"] then ["replace"]
           elif . == ["no-op"] or . == ["read"] then []
           else . end);
    [.resource_changes[]? | {address, ops: ops} | select(.ops | length > 0)] as $rc
    | if ($rc | length) == 0 then "差分なし（No changes）"
      else
        "| 操作 | 件数 |", "|---|---|",
        ($rc | map(.ops[]) | group_by(.) | map("| \(.[0]) | \(length) |")[]),
        "",
        ($rc[] | "- `\(.address)`: \(.ops | join(", "))")
      end

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      ingest_exists: ${{ steps.ingest_image.outputs.exists }}
      viewer_exists: ${{ steps.viewer_image.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: repository variables の確認
        run: |
          for v in GCP_PROJECT_ID TF_STATE_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "repository variable ${v} が未設定（docs/setup.md の「2. GitHub の設定」）"
              exit 1
            fi
          done
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_PLAN }}

      # Artifact Registry にあれば digest、無ければタグ参照で plan する（無ければ Cloud Run に差分が出て apply job が動く）
      - name: イメージの解決（ingest）
        id: ingest_image
        run: .github/scripts/image.sh ingest resolve >> "$GITHUB_OUTPUT"
      - name: イメージの解決（viewer）
        id: viewer_image
        run: .github/scripts/image.sh viewer resolve >> "$GITHUB_OUTPUT"

      - name: terraform plan（prod）
        id: plan
        working-directory: infra/prod
        env:
          # 取り込み用のポリシー ID。ログに出さないよう secret にして、この step だけに渡す
          TF_VAR_alert_policy_ids: ${{ secrets.TF_ALERT_POLICY_IDS || '{}' }}
          TF_VAR_ingest_image: ${{ steps.ingest_image.outputs.image }}
          TF_VAR_viewer_image: ${{ steps.viewer_image.outputs.image }}
          INGEST_TAG: ${{ steps.ingest_image.outputs.tag }}
          INGEST_EXISTS: ${{ steps.ingest_image.outputs.exists }}
          VIEWER_TAG: ${{ steps.viewer_image.outputs.tag }}
          VIEWER_EXISTS: ${{ steps.viewer_image.outputs.exists }}
        run: |
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=tfplan; } > plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ]; then changes=true; else changes=false; fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan（infra/prod、${GITHUB_SHA}）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
            image_line() {  # 名前 タグ 有無
              if [ "$3" = true ]; then
                echo "- イメージ $1: \`$2\` は既存"
              else
                echo "- イメージ $1: \`$2\` は未作成（apply job がビルド・push する）"
              fi
            }
            image_line ingest "$INGEST_TAG" "$INGEST_EXISTS"
            image_line viewer "$VIEWER_TAG" "$VIEWER_EXISTS"
            echo
            if [ "$changes" = true ]; then
              echo "差分あり: apply job が Environment prod の承認を待つ。"
            else
              echo "差分なし: apply は行わない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ビルドは GCP の認証より前に行う（依存の取得中に資格情報ファイルが無いように）。中身の確認は ci.yml の ingest-image / viewer-image と同じ
      - name: イメージのビルド（ingest、未作成のときだけ）
        if: needs.plan.outputs.ingest_exists != 'true'
        run: |
          docker build -f apps/ingest/Dockerfile -t ingest:build .
          docker run --rm ingest:build python -c 'import optionchan_ingest.app'
          # auth.txt・functions/・テストがイメージに入っていないこと
          found=$(docker run --rm --entrypoint sh ingest:build -c \
            'find / -xdev \( -name auth.txt -o -name auth.json -o -path /app/functions -o -path /app/tests -o -name .git \) 2>/dev/null || true' | wc -l)
          test "$found" -eq 0

      - name: イメージのビルド（viewer、未作成のときだけ）
        if: needs.plan.outputs.viewer_exists != 'true'
        run: |
          docker build -t viewer:build apps/viewer
          .github/scripts/viewer-image-check.sh viewer:build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_APPLY }}

      # 承認待ちの間に別の run が push した場合に備えてもう一度確かめる。タグは不変（immutable_tags）なので二重 push は失敗で止まる
      - name: イメージの push と digest の解決
        id: image
        env:
          INGEST_BUILT: ${{ needs.plan.outputs.ingest_exists != 'true' }}
          VIEWER_BUILT: ${{ needs.plan.outputs.viewer_exists != 'true' }}
        run: |
          script=.github/scripts/image.sh
          configured=false
          for name in ingest viewer; do
            built_var="${name^^}_BUILT"
            resolved=$("$script" "$name" resolve)
            if grep -qx 'exists=false' <<<"$resolved"; then
              if [ "${!built_var}" != true ]; then
                echo "イメージ ${name} が Artifact Registry に無いが、この job ではビルドしていない（plan の後に消えた可能性）。deploy をやり直す。"
                exit 1
              fi
              ref=$(sed -n 's/^image=//p' <<<"$resolved")
              if [ "$configured" != true ]; then
                # 出力は認証中のアカウント名を含みうるのでマスクを通す（pipefail で失敗は伝わる）
                gcloud auth configure-docker "${GCP_REGION:-asia-northeast1}-docker.pkg.dev" --quiet 2>&1 | sed -E "$MASK_SED"
                configured=true
              fi
              docker tag "${name}:build" "$ref"
              docker push --quiet "$ref" 2>&1 | sed -E "$MASK_SED"
              resolved=$("$script" "$name" resolve)
            fi
            image=$(sed -n 's/^image=//p' <<<"$resolved")
            tag=$(sed -n 's/^tag=//p' <<<"$resolved")
            if [[ "$image" != *@sha256:* ]]; then
              echo "digest が得られない: ${image}"
              exit 1
            fi
            echo "${name}=${image}" >> "$GITHUB_OUTPUT"
            digest=${image##*@sha256:}
            echo "イメージ ${name}: \`${tag}\`（digest \`sha256:${digest:0:12}\`）" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: terraform apply（prod）
        working-directory: infra/prod
        env:
          # 取り込み用のポリシー ID。ログに出さないよう secret にして、この step だけに渡す
          TF_VAR_alert_policy_ids: ${{ secrets.TF_ALERT_POLICY_IDS || '{}' }}
          TF_VAR_ingest_image: ${{ steps.image.outputs.ingest }}
          TF_VAR_viewer_image: ${{ steps.image.outputs.viewer }}
        run: |
          # Cloud Run には digest でだけデプロイする
          for v in TF_VAR_ingest_image TF_VAR_viewer_image; do
            if [[ "${!v}" != *@sha256:* ]]; then
              echo "${v} が digest 参照でない"
              exit 1
            fi
          done
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform apply -auto-approve -input=false -no-color; } > apply.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform apply が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 apply.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          grep -E '^Apply complete!' apply.log | tee -a "$GITHUB_STEP_SUMMARY"
