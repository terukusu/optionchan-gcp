# master の Terraform を本番へ反映する（#10）。
# plan に差分があるときだけ apply job が動き、Environment prod の承認を待つ（差分 0 なら承認待ちを作らない）。
# plan ファイルは artifact で渡さない（公開リポジトリの artifact は誰でも取得でき、state 由来の値を含む）。
# apply は承認後にもう一度 plan して適用する。
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  # 失敗時のログ末尾に使うマスク: 9 桁以上の数字（プロジェクト番号・チャネル ID 等）と、SA 以外のメールアドレス
  MASK_SED: >-
    s/[0-9]{9,}/<num>/g;
    s/@([A-Za-z0-9-]+)\.iam\.gserviceaccount\.com/__SA__\1__/g;
    s/[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}/<email>/g;
    s/__SA__([A-Za-z0-9-]+)__/@\1.iam.gserviceaccount.com/g
  # terraform show -json の出力から「アドレス: 操作」と操作ごとの件数だけを Markdown にする
  PLAN_SUMMARY_JQ: |
    def ops:
      (if .change.importing then ["import"] else [] end)
      + (.change.actions
         | if . == ["delete", "create"] or . == ["create", "delete"] then ["replace"]
           elif . == ["no-op"] or . == ["read"] then []
           else . end);
    [.resource_changes[]? | {address, ops: ops} | select(.ops | length > 0)] as $rc
    | if ($rc | length) == 0 then "差分なし（No changes）"
      else
        "| 操作 | 件数 |", "|---|---|",
        ($rc | map(.ops[]) | group_by(.) | map("| \(.[0]) | \(length) |")[]),
        "",
        ($rc[] | "- `\(.address)`: \(.ops | join(", "))")
      end

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_PLAN }}

      - name: terraform plan（prod）
        id: plan
        working-directory: infra/prod
        env:
          # 取り込み用のポリシー ID。ログに出さないよう secret にして、この step だけに渡す
          TF_VAR_alert_policy_ids: ${{ secrets.TF_ALERT_POLICY_IDS || '{}' }}
        run: |
          rc=0
          { terraform init -input=false -no-color \
              && terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=tfplan; } > plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ]; then changes=true; else changes=false; fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan（infra/prod、${GITHUB_SHA}）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
            if [ "$changes" = true ]; then
              echo "差分あり: apply job が Environment prod の承認を待つ。"
            else
              echo "差分なし: apply は行わない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_APPLY }}

      - name: terraform apply（prod）
        working-directory: infra/prod
        env:
          # 取り込み用のポリシー ID。ログに出さないよう secret にして、この step だけに渡す
          TF_VAR_alert_policy_ids: ${{ secrets.TF_ALERT_POLICY_IDS || '{}' }}
        run: |
          rc=0
          { terraform init -input=false -no-color \
              && terraform apply -auto-approve -input=false -no-color; } > apply.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform apply が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 apply.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          grep -E '^Apply complete!' apply.log | tee -a "$GITHUB_STEP_SUMMARY"
