<!DOCTYPE html>
<html lang="ja">
<head>
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- 配色（既定はダーク）。CSS・チャートより前に読み、描く前に決める -->
    <script src="/static/theme.js"></script>
    <title>ATM IVの推移</title>
    <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
    <script src="/static/atm_series.js" defer></script>
    <script src="/static/atm_iv.js" defer></script>
    <link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<nav class="page-nav">
    <a href="/">トップへ</a>
    <button id="theme-toggle" type="button">ライト表示</button>
</nav>
<h1 class="chart-title">ATMオプションIV推移</h1>
<div id="control">
    <label>足
        <select id="tf">
            <option value="1m">1分</option>
            <option value="5m">5分</option>
            <option value="15m">15分</option>
            <option value="1h" selected>1時間</option>
            <option value="1d">日足</option>
        </select>
    </label>
    <label>限月
        <!-- 選択肢は static/atm_series.js の系列の表から atm_iv.js が作る（0・1・期近つなぎ・30日固定。既定は 0） -->
        <select id="nmonth"></select>
    </label>
    <label>IV
        <select id="ivkind">
            <option value="mid" selected>mid（気配の中値）</option>
            <option value="trade">約定</option>
        </select>
    </label>
    <label>表示
        <select id="style">
            <option value="candle" selected>ローソク足</option>
            <option value="line">折れ線</option>
        </select>
    </label>
    <label>日付（JST）<input id="jump-date" type="date" min="2018-10-19"></label>
</div>
<div id="legend" class="chart-legend"></div>
<div id="chart-wrap" class="chart-wrap" aria-busy="true">
    <div id="chart" class="chart-box"></div>
    <!-- 読み込み中（最初・足と限月の切り替え）: チャートを薄くしてスピナー -->
    <div id="chart-busy" class="chart-busy" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span><span>読み込み中…</span>
    </div>
    <!-- 表示範囲の外の追加の読み込み: 端のバッジ -->
    <div id="chart-edge" class="chart-edge" role="status" hidden>
        <span class="spinner spinner-small" aria-hidden="true"></span><span id="chart-edge-text"></span>
    </div>
    <div id="chart-error" class="chart-error" role="alert" hidden>
        <div class="chart-error-box">
            <span id="chart-error-text"></span>
            <button id="chart-retry" type="button">再試行</button>
        </div>
    </div>
    <!-- 足が 0 本: チャートの真ん中に理由と「期近つなぎで表示」「約定で表示」（atm_iv.js が AtmSeries.emptyHint から出す。
         ページの下だと最初の画面の外になって気づかない） -->
    <div id="chart-empty" class="chart-empty" role="status" hidden>
        <div class="chart-empty-box">
            <span id="chart-empty-text"></span>
            <button id="empty-action" type="button" hidden></button>
        </div>
    </div>
</div>
<div id="message" class="chart-note"></div>
<p class="attribution">
    チャート: <a id="attribution-link" rel="noopener noreferrer" target="_blank">TradingView Lightweight Charts™</a>
    Copyright (c) 2025 TradingView, Inc.
</p>
</body>
</html>
