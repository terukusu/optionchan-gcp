<!DOCTYPE html>
<html lang="ja">
<head>
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ATM IVの推移</title>
    <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
    <script src="/static/atm_iv.js" defer></script>
    <link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<a href="/">トップへ</a>
<h1 class="chart-title">ATMオプションIV推移</h1>
<div id="control">
    <label>足
        <select id="tf">
            <option value="1m">1分</option>
            <option value="5m">5分</option>
            <option value="15m">15分</option>
            <option value="1h" selected>1時間</option>
            <option value="1d">日足</option>
        </select>
    </label>
    <label>期間
        <select id="days"></select>
    </label>
    <label>限月
        <select id="nmonth">
            <option value="0" selected>0</option>
            <option value="1">1</option>
        </select>
    </label>
</div>
<div id="legend" class="chart-legend"></div>
<div id="chart" class="chart-box"></div>
<div id="message"></div>
<div id="loading">
    <img src="/static/loading.gif" alt="読み込み中">
</div>
<p class="attribution">
    チャート: <a id="attribution-link" rel="noopener noreferrer" target="_blank">TradingView Lightweight Charts™</a>
    Copyright (c) 2025 TradingView, Inc.
</p>
</body>
</html>
