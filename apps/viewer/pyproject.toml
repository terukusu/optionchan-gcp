[project]
name = "optionchan-viewer"
version = "0.1.0"
description = "日経225オプションのビューアー（UI + CSV の API）。BigQuery（新系のデータセット）を直接読む Cloud Run サービス"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 正確な版とハッシュは uv.lock で固定する（pandas・bqstorage は入れない）
    "flask>=3.1",
    "gunicorn>=23",
    "google-cloud-bigquery>=3.30",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# 公開から 2 週間未満の版を入れない（サプライチェーン対策）。更新するときはこの日付を進めて uv lock する
exclude-newer = "2026-09-28T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 現行の SQL の一字一句の写し（長い行・行末の空白も写し元のまま）
"tests/legacy_sql.py" = ["E501", "W291"]
